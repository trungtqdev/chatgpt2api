services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: chatgpt2api:latest
    container_name: chatgpt2api
    restart: unless-stopped
    ports:
      - "127.0.0.1:3300:80"
    volumes:
      - ./data:/app/data
      - ./config.json:/app/config.json
    environment:
      # Cấu hình lưu trữ (tùy chọn: json, sqlite, postgres, git)
      - STORAGE_BACKEND=json
      
      # Cấu hình cơ sở dữ liệu (khi STORAGE_BACKEND=sqlite/postgres)
      # - DATABASE_URL=postgresql://user:password@host:5432/dbname
      # - DATABASE_URL=sqlite:///app/data/accounts.db
      
      # Cấu hình kho lưu trữ Git (khi STORAGE_BACKEND=git)
      # - GIT_REPO_URL=https://github.com/user/repo.git
      # - GIT_TOKEN=ghp_xxxxxxxxxxxx
      # - GIT_BRANCH=main
      # - GIT_FILE_PATH=accounts.json
      
      # Khóa xác thực (tùy chọn, ghi đè auth-key trong config.json)
      # - CHATGPT2API_AUTH_KEY=your_secret_key
      
      # URL cơ sở (tùy chọn)
      # - CHATGPT2API_BASE_URL=https://apikeygpt.pagee.io.vn
